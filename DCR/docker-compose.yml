services:
  microservice:
    build: ./microservice
    container_name: p5-microservice
    ports:
      - "5001:5001"
    env_file:
      - ./microservice/.env
    depends_on:
      - siddhi

  siddhi:
    build: ./siddhi
    container_name: p5-siddhi
    ports:
      - "7071:7071"   # delay readings in
      - "7072:7072"   # callbacks from the microservice
      - "7073:7073"   # actions by people in
      - "7074:7074"   # board entries in
      - "7075:7075"   # route stops in
      - "7076:7076"   # trips that ended in

  logging-service:
    build: ./logging_service
    container_name: p5-logging
    ports:
      - "5010:5010"
    volumes:
      - ./logging_service/logs:/logs
      - ./logging_service/XES:/XES
